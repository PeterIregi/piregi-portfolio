name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Neither of these needs a database or any env var: both parse
      # src/app/globals.css, so a renamed or deleted colour token fails here
      # rather than shipping as a class that compiles to nothing.
      - name: Check colour tokens resolve
        run: pnpm check:classes

      - name: Check contrast
        run: pnpm check:contrast

      # No DATABASE_URL here on purpose: nothing in the app should need a
      # live database to compile or render. If a build fails for want of
      # env vars, that is a real finding, not something to paper over with
      # a secret (design.md §8 keeps production vars off preview too).
      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          AUTH_SECRET: ci-build-only-not-a-real-secret
