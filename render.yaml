# Render Blueprint. Apply with: Render dashboard -> New -> Blueprint -> this repo.
# Secrets (sync: false) are prompted for at apply time and stored encrypted in
# Render; never commit real values here.
#
# Build and start commands assume Render's native Node runtime, not a
# Dockerfile: it installs dependencies and leaves node_modules in place, so
# `next start` has what it needs and next.config.ts needs no `output:
# "standalone"` (which would only pay off for a container image).

services:
  - type: web
    name: piregi-portfolio
    runtime: node
    plan: starter
    # Change to the region your Supabase production project sits in. This
    # matters: the app opens a Postgres connection per cold start, so a
    # cross-region deploy pays that latency on every request that needs data.
    region: oregon
    branch: main
    repo: https://github.com/PeterIregi/piregi-portfolio
    # corepack first: package.json pins pnpm@12.5.1 and the build must use
    # that exact version or the lockfile is resolved differently.
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /
    autoDeploy: true
    # Only available on paid plans. Runs after the build succeeds and before
    # the new version goes live, so a failed migration leaves the previous
    # deploy serving. On the free plan, delete this line and run migrations
    # from a one-off job or the shell (see DEPLOYMENT.md step 5).
    preDeployCommand: pnpm db:migrate
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # Auth.js trusts the Host header only when this is set or when it
      # detects a known host platform. Vercel sets VERCEL=1, which is why
      # this is absent from the old Vercel notes in .env.example; Render sets
      # nothing Auth.js recognises, so without it every /api/auth/* request
      # 500s with UntrustedHost and the admin login form appears broken.
      - key: AUTH_TRUST_HOST
        value: "true"
      # Canonical origin for sitemap.xml, robots.txt, JSON-LD and Open Graph.
      # Must match the domain the site is actually served from, scheme
      # included, or social previews point at the wrong host.
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      # openssl rand -base64 32
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Both optional: without RESEND_API_KEY the mailer logs to console
      # instead, and CONTACT_NOTIFY_EMAIL is the inbox that receives
      # contact-form submissions.
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_NOTIFY_EMAIL
        sync: false